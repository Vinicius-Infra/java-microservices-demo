# Configuração do Servidor
server.port=8083

# Perfil de Ativação
spring.profiles.active=postgres

# Configurações do Banco de Dados (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5434/audit_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=audit-group

# Desabilitar o Open-In-View para melhor performance (Boas práticas DevOps)
spring.jpa.open-in-view=false

# Swagger/OpenAPI Path (Opcional, para diferenciar do Kotlin)
springdoc.swagger-ui.path=/swagger-ui.html