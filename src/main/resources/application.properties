# Configuração do Servidor
server.port=8081

# Configurações do Banco de Dados (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5434/audit_db
spring.datasource.username=demo
spring.datasource.password=demo123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desabilitar o Open-In-View para melhor performance (Boas práticas DevOps)
spring.jpa.open-in-view=false

# Swagger/OpenAPI Path (Opcional, para diferenciar do Kotlin)
springdoc.swagger-ui.path=/swagger-ui.html